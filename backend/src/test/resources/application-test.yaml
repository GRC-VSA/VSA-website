server:
  port: 8080

spring:
  application:
    name: backend-test

  datasource:
    url: jdbc:postgresql://localhost:5432/vsa_db_test
    username: vsa_user
    password: vsa_password
    driver-class-name: org.postgresql.Driver

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false

  mail:
    host: localhost
    port: 2525
    username: test@vsa.com
    password: testpassword
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

jwt:
  secret: "vsa-super-secret-key-that-is-long-enough-for-hs256-algorithm"
  expiration: 86400000

frontend:
  url: http://localhost:5173