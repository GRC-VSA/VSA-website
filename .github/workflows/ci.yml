name: VSA Website CI

# Triggers
on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]

jobs:
  # Build the Spring Boot Backend
  backend:
    name: Build & Test Backend
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: vsa_db_test
          POSTGRES_USER: vsa_user
          POSTGRES_PASSWORD: vsa_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vsa_user -d vsa_db_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}

      - name: Build with Maven
        working-directory: ./backend
        run: ./mvnw clean install -DskipTests

      - name: Run tests with Maven
        working-directory: ./backend
        env:
          SPRING_PROFILES_ACTIVE: test
          DB_URL: jdbc:postgresql://localhost:5432/vsa_db_test
          DB_USERNAME: vsa_user
          DB_PASSWORD: vsa_password
          MAIL_USERNAME: test@vsa.com
          MAIL_PASSWORD: testpassword
          JWT_SECRET: XrvacgnP6R03xIstugi0vnEV+6xPySC7Rf1V7X3r9kM=
          FRONTEND_URL: http://localhost:5173
          AWS_REGION: us-east-2
          S3_BUCKET_NAME: test-vsa-event-images
          CLOUDFRONT_DOMAIN: https://images.example.com
        run: ./mvnw test

  # Build & Test React Frontend
  frontend:
    name: Build & Test Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci --legacy-peer-deps

      - name: Run frontend tests
        working-directory: ./frontend
        run: npx vitest run

      - name: Build React app
        working-directory: ./frontend
        run: npm run build